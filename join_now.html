<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Gym - Membership Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 80px;
        }
        .submit-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join Our Gym</h1>
        <form id="membershipForm" action="save_membership.php" method="POST">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label for="address">Address:</label>
                <textarea id="address" name="address" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="duration">Membership Duration:</label>
                <select id="duration" name="duration" required>
                    <option value="">Select Duration</option>
                    <option value="6">6 Months</option>
                    <option value="12">1 Year</option>
                    <option value="24">2 Years</option>
                </select>
            </div>
            
            <div class="form-group">
                <button type="submit" class="submit-btn">Join Now</button>
            </div>
        </form>
    </div>

    <script>
        // Client-side validation
        document.getElementById('membershipForm').addEventListener('submit', function(e) {
            let valid = true;
            
            // Clear previous errors
            document.querySelectorAll('.error').forEach(el => el.remove());
            
            // Name validation
            const name = document.getElementById('name').value.trim();
            if (name === '') {
                showError('name', 'Name is required');
                valid = false;
            }
            
            // Email validation
            const email = document.getElementById('email').value.trim();
            if (email === '') {
                showError('email', 'Email is required');
                valid = false;
            } else if (!isValidEmail(email)) {
                showError('email', 'Please enter a valid email');
                valid = false;
            }
            
            // Phone validation
            const phone = document.getElementById('phone').value.trim();
            if (phone === '') {
                showError('phone', 'Phone number is required');
                valid = false;
            } else if (!/^\d{10,15}$/.test(phone)) {
                showError('phone', 'Please enter a valid phone number (10-15 digits)');
                valid = false;
            }
            
            // Address validation
            const address = document.getElementById('address').value.trim();
            if (address === '') {
                showError('address', 'Address is required');
                valid = false;
            }
            
            // Duration validation
            const duration = document.getElementById('duration').value;
            if (duration === '') {
                showError('duration', 'Please select a membership duration');
                valid = false;
            }
            
            if (!valid) {
                e.preventDefault();
            }
        });
        
        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const error = document.createElement('div');
            error.className = 'error';
            error.textContent = message;
            field.parentNode.appendChild(error);
        }
        
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
    </script>
</body>
</html>
